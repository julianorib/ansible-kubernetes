---
  - name: Adicionar repositorio Prometheus-Community
    ansible.builtin.shell: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

  - name: Adicionar repositorio Grafana
    ansible.builtin.shell: helm repo add grafana https://grafana.github.io/helm-charts

  - name: Atualizar repositorios
    ansible.builtin.shell: helm repo update
      
  - name: Instalar o Prometheus-Stack
    ansible.builtin.shell: helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --create-namespace -n monitoring --set grafana.enabled=false

  - name: Instalar o Grafana
    ansible.builtin.shell: helm upgrade --install grafana grafana/grafana -n monitoring --create-namespace --set persistence.enabled=true --set persistence.storageClassName=nfs-client

  - name: Copiar values Loki
    ansible.builtin.copy:
      src: loki.yaml
      dest: /tmp/loki.yaml

  - name: Instalar o Loki
    ansible.builtin.shell: helm upgrade --install loki grafana/loki -n monitoring --create-namespace --values /tmp/loki.yaml --set singleBinary.persistence.storageClass=nfs-client

  - name: Copiar values Promtail
    ansible.builtin.copy:
      src: promtail.yaml
      dest: /tmp/promtail.yaml

  - name: Instalar o Promtail
    ansible.builtin.shell: helm upgrade --install promtail grafana/promtail -n monitoring --create-namespace --values /tmp/promtail.yaml

  - name: Obter senha grafana
    shell: 'kubectl get secret --namespace monitoring grafana -o jsonpath="{.data.admin-password}" | base64 --decode ; echo'
    register: Passowrd

  - name: Observações finais
    debug: 
      msg: 
        - "Execute kubectl -n monitoring port-forward svc/grafana 3000:80 ou crie um Ingressroute para acesso." 
        - "Usuário Grafana: admin / Senha do Grafana: {{ Passowrd.stdout }}"
        - "Adicione o Datasource do Prometheus apontado para http://prometheus-kube-prometheus-prometheus:9090"
        - "Adicione o Datasource do Loki apontado para http://loki-gateway/ com Headers: X-Scope-OrgId Value: 1"
        - "Importe os Dashboards: 16966, 15757, 15758, 15759, 15760"