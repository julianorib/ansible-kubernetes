apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-auth
  namespace: traefik
spec:
  basicAuth:
    secret: traefik-authsecret
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingressroute
  namespace: traefik
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`{{ traefikdns }}`)
    services:
    - name: api@internal
      kind: TraefikService
    middlewares:
      - name: traefik-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-authsecret
  namespace: traefik
type: kubernetes.io/basic-auth
data:
  username: YWRtaW4= # admin
  password: RGV2MjAwOQ== # Dev2009
